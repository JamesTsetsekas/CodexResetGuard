name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build, test, and package
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a vX.Y.Z release tag.' }
          .\scripts\Release.ps1 -Version $env:RELEASE_TAG.Substring(1)
      - name: Publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $zipPath = Join-Path 'artifacts' ('CodexResetGuard-' + $env:RELEASE_TAG.Substring(1) + '-windows-x64.zip')
          gh release create $env:RELEASE_TAG $zipPath artifacts/SHA256SUMS.txt --verify-tag --title ('Codex Reset Guard ' + $env:RELEASE_TAG) --notes-file docs/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
